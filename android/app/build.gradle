plugins { id 'com.android.application' }
android {
    namespace 'br.com.quindou.app'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.quindou.app'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { debuggable true } }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1'; androidTestImplementation 'junit:junit:4.13.2'; androidTestImplementation 'androidx.test.ext:junit:1.2.1'; androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test:core:1.6.1' }
