plugins { id 'com.android.application' }
android {
    namespace 'br.com.quindou.app'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.quindou.app'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
    testOptions { unitTests.includeAndroidResources = true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { debuggable true } }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.robolectric:robolectric:4.14.1' }
