name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Include production Android interface
        run: |
          mkdir -p android/app/src/main/assets
          cp android/ui/* android/app/src/main/assets/
      - name: Build installable test APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test real PDF persistence on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd android && gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Verify APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Quindou-1.1.0.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose Quindou-1.1.0.apk
          "$BUILD_TOOLS/aapt" dump badging Quindou-1.1.0.apk
          sha256sum Quindou-1.1.0.apk > Quindou-1.1.0.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Quindou-Android-1.1.0
          path: |
            Quindou-1.1.0.apk
            Quindou-1.1.0.apk.sha256
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/androidTests/connected/
      - name: Publish direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create android-v1.1.0 Quindou-1.1.0.apk Quindou-1.1.0.apk.sha256 --target "$GITHUB_SHA" --title 'Quindou Android 1.1.0 — teste' --prerelease --notes 'Login e cadastro online no Supabase, biblioteca inicialmente vazia, PDFs copiados para o armazenamento privado por conta e progresso persistente. Android 7+. Documentos ficam somente neste aparelho. Versão de teste: a assinatura mudou desde 1.0.0; desinstale a versão antiga antes de instalar. Confirmação de cadastro por e-mail depende da configuração de envio do servidor.'
